name: Update Google reviews
on:
  schedule:
    - cron: '0 20 * * *'   # 每天 20:00 UTC（台灣時間凌晨 4:00），一天只跑一次
  workflow_dispatch:        # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch reviews
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_DATA_ID: ${{ secrets.GOOGLE_DATA_ID }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/update-reviews.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain reviews-data.json)" ]; then
            git config user.name  "reviews-bot"
            git config user.email "reviews-bot@users.noreply.github.com"
            git add reviews-data.json
            git commit -m "chore: update Google reviews"
            git push
          fi
