<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>車牌掃描</title>
<style>
  :root { --bg:#14171a; --panel:#1e2226; --text:#eef0f2; --sub:#9aa3ab; --accent:#3ddc84; --accent-dim:#2a8f57; --border:#2b3136; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px)); }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:1rem; margin:0 0 8px; text-align:center; }
  .cam { position:relative; background:#000; border-radius:12px; overflow:hidden; width:55%; max-width:220px; margin:0 auto; }
  video { width:100%; display:block; }
  .guide { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border:2px solid var(--accent);
    border-radius:8px; box-shadow:0 0 0 9999px rgba(0,0,0,.5); pointer-events:none; }
  .tip { position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:12px; background:rgba(0,0,0,.6);
    padding:3px 10px; border-radius:6px; color:#cfd6dc; white-space:nowrap; pointer-events:none; }
  button { font:inherit; font-weight:600; border:none; border-radius:10px; padding:10px; width:100%; margin-top:8px; cursor:pointer; }
  .primary { background:var(--accent); color:#06231a; }
  .primary:disabled { background:#37403a; color:#7c877f; }
  .second { background:transparent; color:var(--accent); border:1px solid var(--accent-dim); }
  .status { font-size:13px; color:var(--sub); text-align:center; margin-top:6px; min-height:1.3em; }
  .result { display:none; margin-top:8px; }
  .label { font-size:12px; color:var(--sub); margin-bottom:6px; }
  input { width:100%; font-size:26px; font-weight:700; letter-spacing:.08em; text-align:center; padding:8px;
    border-radius:10px; border:1.5px solid var(--accent-dim); background:#0f1214; color:var(--text); }
  .thumb { display:block; width:100%; max-height:50px; object-fit:contain; background:#000; border-radius:8px; margin-bottom:6px; }
  .ok { color:var(--accent); }
  #lock { padding-top:12vh; }
  #lock input { font-size:20px; letter-spacing:.1em; margin-top:8px; }
  #lock .link { background:none; border:none; color:var(--sub); font-size:12px; font-weight:400; margin-top:14px; text-decoration:underline; }
  .cands { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .cands button { width:auto; margin:0; padding:6px 10px; font-size:15px; letter-spacing:.05em; background:#0f1214; color:var(--text); border:1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <div id="lock" style="display:none">
    <h1 id="lockTitle">🔒 請輸入 PIN</h1>
    <input id="pinIn" type="password" inputmode="numeric" placeholder="PIN 碼" autocomplete="off">
    <button id="unlockBtn" class="primary">解鎖</button>
    <div class="status" id="lockMsg"></div>
  </div>
  <div id="app" style="display:none">
  <h1>🔍 車牌掃描(送到電腦)</h1>
  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="guide" id="guide"></div>
    <div class="tip">把車牌放進綠框內、拍清楚不反光</div>
  </div>
  <button id="startBtn" class="primary">📸 開啟相機</button>
  <button id="captureBtn" class="primary" style="display:none">📷 拍照辨識</button>
  <button id="autoBtn" class="second" style="display:none">🔁 開始自動掃描</button>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <img class="thumb" id="thumb" alt="">
    <div class="label">辨識結果(不對請直接修改)</div>
    <input id="plate" type="text" spellcheck="false" autocapitalize="characters" autocomplete="off">
    <div class="cands" id="cands"></div>
    <button id="sendBtn" class="primary">✅ 確認並送到電腦</button>
    <button id="retryBtn" class="second">重新拍攝</button>
  </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  // ====== 設定 ======
  let RELAY = '';   // 解鎖後才會設定(配對碼不寫在網頁裡)
  const KEEP_HYPHEN = false;
  const GUIDE_WIDTH_RATIO = 0.86;
  const GUIDE_ASPECT = 2.0;
  const OCR_TARGET_WIDTH = 1000;
  // ==================

  const $ = (id) => document.getElementById(id);
  const video = $('video'), guide = $('guide'), statusEl = $('status');
  const startBtn = $('startBtn'), captureBtn = $('captureBtn');
  const result = $('result'), thumb = $('thumb'), plateInput = $('plate');
  let stream = null, workerPromise = null, cropRect = null;

  const setStatus = (t, ok) => { statusEl.textContent = t; statusEl.classList.toggle('ok', !!ok); };

  function getWorker() {
    if (!workerPromise) {
      workerPromise = (async () => {
        const w = await Tesseract.createWorker({
          langPath: 'https://tessdata.projectnaptha.com/4.0.0_fast',   // 輕量版辨識資料,下載快、辨識也快
          logger: (m) => { if (m.status === 'recognizing text') setStatus('辨識中… ' + Math.round(m.progress * 100) + '%'); }
        });
        await w.loadLanguage('eng');
        await w.initialize('eng');
        await w.setParameters({
          tessedit_char_whitelist: 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789-',
          tessedit_pageseg_mode: '7'
        });
        return w;
      })();
      workerPromise.catch(() => { workerPromise = null; });
    }
    return workerPromise;
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('此瀏覽器不支援相機(網址必須是 HTTPS)'); return;
    }
    startBtn.disabled = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false
      });
      video.srcObject = stream;
      try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
      await video.play().catch(() => {});
      startBtn.style.display = 'none';
      captureBtn.style.display = '';
      autoBtn.style.display = '';
      setStatus('');
      getWorker().catch((e) => setStatus('OCR引擎載入失敗:' + e.message));
    } catch (err) {
      startBtn.disabled = false;
      setStatus('無法開啟相機:' + err.name + '(請允許相機權限)');
    }
  }

  function layoutGuide() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const cw = vw * GUIDE_WIDTH_RATIO;
    const ch = Math.min(cw / GUIDE_ASPECT, vh * 0.9);
    cropRect = { x: (vw - cw) / 2, y: (vh - ch) / 2, w: cw, h: ch };
    guide.style.width = (cw / vw * 100) + '%';
    guide.style.height = (ch / vh * 100) + '%';
  }
  video.addEventListener('loadedmetadata', layoutGuide);
  video.addEventListener('resize', layoutGuide);

  // ---------- 前處理 ----------
  function cropToGray() {
    if (!cropRect) layoutGuide();
    const scale = OCR_TARGET_WIDTH / cropRect.w;
    const w = Math.round(cropRect.w * scale), h = Math.round(cropRect.h * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, cropRect.x, cropRect.y, cropRect.w, cropRect.h, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    const g = new Uint8ClampedArray(w * h);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    return { g, w, h };
  }
  function toCanvas(g, w, h) {           // 加 40px 白邊(Tesseract 需要留白)
    const pad = 40, c = document.createElement('canvas');
    c.width = w + pad * 2; c.height = h + pad * 2;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    const im = ctx.createImageData(w, h);
    for (let i = 0; i < g.length; i++) { const v = g[i]; im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = v; im.data[i*4+3] = 255; }
    const t = document.createElement('canvas'); t.width = w; t.height = h;
    t.getContext('2d').putImageData(im, 0, 0);
    ctx.drawImage(t, pad, pad);
    return c;
  }
  function stretch(g) {                  // 2%~98% 百分位拉伸
    const hist = new Array(256).fill(0); g.forEach(v => hist[v]++);
    const lo = pct(hist, g.length, 0.02), hi = pct(hist, g.length, 0.98), r = Math.max(hi - lo, 1);
    return g.map(v => Math.max(0, Math.min(255, (v - lo) / r * 255)));
  }
  function pct(hist, n, p) { let a = 0; for (let i = 0; i < 256; i++) { a += hist[i]; if (a >= n * p) return i; } return 255; }
  function otsu(g) {
    const hist = new Array(256).fill(0); g.forEach(v => hist[Math.round(v)]++);
    const total = g.length; let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sB = 0, wB = 0, best = 0, th = 128;
    for (let t = 0; t < 256; t++) {
      wB += hist[t]; if (!wB) continue; const wF = total - wB; if (!wF) break;
      sB += t * hist[t];
      const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
      if (v > best) { best = v; th = t; }
    }
    return th;
  }
  function normPolarity(bin) {           // 確保「黑字白底」:黑色像素應為少數
    let black = 0; for (let i = 0; i < bin.length; i++) if (!bin[i]) black++;
    if (black > bin.length / 2) for (let i = 0; i < bin.length; i++) bin[i] = bin[i] ? 0 : 255;
    return bin;
  }
  function adaptive(g, w, h) {           // 區域平均二值化(抗反光/陰影)
    const I = new Float64Array((w + 1) * (h + 1));
    for (let y = 0; y < h; y++) { let row = 0; for (let x = 0; x < w; x++) { row += g[y*w+x]; I[(y+1)*(w+1)+x+1] = I[y*(w+1)+x+1] + row; } }
    const r = Math.max(15, Math.round(h / 4)), out = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const x1 = Math.max(0, x - r), x2 = Math.min(w, x + r + 1), y1 = Math.max(0, y - r), y2 = Math.min(h, y + r + 1);
      const s = I[y2*(w+1)+x2] - I[y1*(w+1)+x2] - I[y2*(w+1)+x1] + I[y1*(w+1)+x1];
      const mean = s / ((x2 - x1) * (y2 - y1));
      out[y*w+x] = g[y*w+x] < mean * 0.85 ? 0 : 255;
    }
    return out;
  }
  function buildVariants(fast) {
    const { g, w, h } = cropToGray();
    const st = stretch(g);
    const adBin = normPolarity(adaptive(st, w, h));
    if (fast) return [{ name: '自適應', canvas: toCanvas(adBin, w, h) }];   // 自動掃描:只做最抗反光的一種,求快
    const th = otsu(st);
    const otsuBin = normPolarity(st.map(v => v > th ? 255 : 0));
    return [                                                        // 自適應排第一:多數情況一次就過,省下後面兩次辨識的時間
      { name: '自適應', canvas: toCanvas(adBin, w, h) },
      { name: '灰階', canvas: toCanvas(st, w, h) },
      { name: 'Otsu', canvas: toCanvas(otsuBin, w, h) },
    ];
  }

  // ---------- 格式校正(台灣車牌:L=字母 D=數字)----------
  // 台灣車牌常見格式(L=字母 D=數字;字母不使用 I、O)
  const PATTERNS = ['LLLDDDD', 'LLDDDD', 'DDDDLL', 'LLLDDD', 'DDDLLL'];
  const LETTER_OK = /^[A-HJ-NP-Z]$/;
  const TO_DIGIT = { O:'0', Q:'0', D:'0', I:'1', L:'1', Z:'2', S:'5', G:'6', B:'8', T:'7' };
  const TO_LETTER = { '0':'D', '1':'L', '2':'Z', '5':'S', '6':'G', '8':'B', '7':'T', I:'L', O:'D' };
  const isD = (c) => c >= '0' && c <= '9';
  function fitPattern(t) {               // 回傳 {text, cost, pattern};cost=修正字數,Infinity=不符合標準
    let best = { text: t, cost: Infinity, pattern: null };
    for (const p of PATTERNS) {
      if (p.length !== t.length) continue;
      let out = '', cost = 0;
      for (let i = 0; i < t.length; i++) {
        const c = t[i], wantD = p[i] === 'D';
        if (wantD ? isD(c) : LETTER_OK.test(c)) out += c;
        else { const m = wantD ? TO_DIGIT[c] : TO_LETTER[c]; if (!m) { cost = Infinity; break; } out += m; cost++; }
      }
      if (cost < best.cost) best = { text: out, cost, pattern: p };
    }
    return best;
  }
  function fitBest(raw) {                // 不符時,嘗試刪掉 1 個雜訊字元
    let best = fitPattern(raw);
    if (raw.length >= 6) for (let i = 0; i < raw.length; i++) {
      const f = fitPattern(raw.slice(0, i) + raw.slice(i + 1));
      if (f.cost + 2 < best.cost) best = { ...f, cost: f.cost + 2 };
    }
    return best;
  }
  const isValidPlate = (t) => fitPattern(t.replace(/-/g, '')).cost === 0;
  function hyphenate(t, pattern) {       // 顯示用:ABC-1234
    if (!pattern) return t;
    let k = 1; while (k < pattern.length && pattern[k] === pattern[0]) k++;
    return t.slice(0, k) + '-' + t.slice(k);
  }

  const clean = (raw) => (raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const looksLikePlate = (t) => t.length >= 5 && t.length <= 7;

  // 外形相近的字元(用來產生「類似選項」)
  const SIMILAR = { '0':'86D','1':'7L','2':'7Z','3':'85','4':'9','5':'6S','6':'58G','7':'12','8':'036B','9':'40',
    A:'H', B:'RE8', C:'GO', D:'B0', E:'FB', F:'E', G:'C6', H:'AN', K:'X', L:'1', M:'N', N:'MH', P:'R', R:'PB', S:'Z5', T:'7', U:'V', V:'UY', W:'V', X:'K', Y:'V', Z:'S2' };
  function similarOptions(text, pattern, exclude) {
    const out = [];
    for (let i = 0; i < text.length; i++) {
      for (const ch of (SIMILAR[text[i]] || '')) {
        if ((pattern[i] === 'D') !== isD(ch)) continue;               // 要符合該位置的字母/數字類型
        if (pattern[i] === 'L' && !LETTER_OK.test(ch)) continue;      // 字母不使用 I、O
        const t = text.slice(0, i) + ch + text.slice(i + 1);
        if (t === text || exclude.has(t) || out.some(o => o.t === t)) continue;
        out.push({ t, i });
      }
    }
    return out;
  }

  async function ocrOne(worker, canvas, psm) {
    await worker.setParameters({ tessedit_pageseg_mode: String(psm) });
    const { data } = await worker.recognize(canvas);
    const raw = clean(data.text);
    const fit = fitBest(raw);
    const valid = fit.cost !== Infinity;
    const conf = data.confidence || 0;
    const score = conf + (valid ? 10 - fit.cost * 6 : -40);
    return { raw, text: valid ? fit.text : raw, pattern: fit.pattern, valid, cost: fit.cost, score, conf };
  }

  async function finalizeCapture() {
    if (!stream || !video.videoWidth) { setStatus('相機尚未就緒'); return; }
    captureBtn.disabled = true;
    autoBtn.disabled = true;
    captureBtn.textContent = '辨識中…';
    result.style.display = 'none';
    setStatus('載入辨識引擎…(第一次會比較久)');
    try {
      const variants = buildVariants();
      const worker = await getWorker();
      const results = [];
      for (let i = 0; i < variants.length; i++) {
        setStatus('辨識中… (' + (i + 1) + '/' + variants.length + ' ' + variants[i].name + ')');
        const r = { ...(await ocrOne(worker, variants[i].canvas, 7)), v: i };
        results.push(r);
        if (r.valid && r.cost === 0 && r.conf >= 65) break;    // 第一張就穩穩符合車牌格式,不用再多花時間辨識剩下的版本
      }
      if (!results.some(r => r.valid)) {       // 備援:多行模式
        for (let i = 0; i < variants.length; i++) {
          if (results.some(r => r.v === i)) continue;
          results.push({ ...(await ocrOne(worker, variants[i].canvas, 6)), v: i });
        }
      }
      await worker.setParameters({ tessedit_pageseg_mode: '7' });
      results.sort((a, b) => b.score - a.score);
      const best = results[0];
      const text = best.text;
      const others = [...new Set(results.filter(r => r.valid).map(r => r.text).filter(t => t !== text))].slice(0, 3);
      const cands = others.map(t => ({ t, i: -1 }));
      const seenSet = new Set([text, ...others]);
      (best.valid ? similarOptions(text, best.pattern, seenSet) : []).slice(0, 9 - cands.length).forEach(o => cands.push(o));

      thumb.src = variants[best.v].canvas.toDataURL('image/jpeg', 0.8);
      plateInput.value = KEEP_HYPHEN ? hyphenate(text, best.pattern) : text;
      const box = $('cands'); box.innerHTML = '';
      cands.forEach(c => {
        const b = document.createElement('button');
        for (let k = 0; k < c.t.length; k++) {
          const sp = document.createElement('span'); sp.textContent = c.t[k];
          if (k === c.i) sp.style.color = '#ffb84d';               // 標出被替換的字
          b.appendChild(sp);
        }
        b.onclick = () => { plateInput.value = c.t; };
        box.appendChild(b);
      });
      result.style.display = 'block';
      $('cam').style.display = 'none';
      captureBtn.style.display = 'none';
      autoBtn.style.display = 'none';
      setStatus(text ? (best.valid ? '請核對車牌後按確認' + (cands.length ? '(下方有類似選項可替換)' : '') : '⚠️ 不符合台灣車牌格式,請核對或重拍')
                     : '沒有辨識到文字,請重拍或手動輸入');
    } catch (err) {
      setStatus('辨識失敗:' + err.message);
    } finally {
      captureBtn.disabled = false;
      autoBtn.disabled = false;
      captureBtn.textContent = '📷 拍照辨識';
    }
  }

  captureBtn.addEventListener('click', finalizeCapture);

  // ---------- 自動掃描 ----------
  const autoBtn = $('autoBtn');
  let autoMode = false, autoTimer = null, autoBusy = false, lastAutoText = '', autoStreak = 0;
  const AUTO_INTERVAL_MS = 800, AUTO_CONFIRM_HITS = 2;

  async function autoTick() {
    if (!autoMode || autoBusy || !stream || !video.videoWidth) return;
    autoBusy = true;
    try {
      const variants = buildVariants(true);
      const worker = await getWorker();
      const r = await ocrOne(worker, variants[0].canvas, 7);
      if (r.valid) {
        if (r.text === lastAutoText) autoStreak++; else { lastAutoText = r.text; autoStreak = 1; }
        setStatus('偵測到 ' + r.text + '…確認中(' + autoStreak + '/' + AUTO_CONFIRM_HITS + ')');
        if (autoStreak >= AUTO_CONFIRM_HITS) {
          stopAutoScan();
          try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
          await finalizeCapture();
          return;
        }
      } else {
        lastAutoText = ''; autoStreak = 0;
        setStatus('自動掃描中…把車牌對準綠框');
      }
    } catch (e) { /* 單次失敗忽略,下一輪再試 */ }
    autoBusy = false;
  }

  function startAutoScan() {
    if (!stream || !video.videoWidth) { setStatus('相機尚未就緒'); return; }
    autoMode = true; lastAutoText = ''; autoStreak = 0;
    captureBtn.style.display = 'none';
    autoBtn.textContent = '⏹ 停止自動掃描';
    setStatus('自動掃描中…把車牌對準綠框');
    getWorker().catch(() => {});
    autoTimer = setInterval(autoTick, AUTO_INTERVAL_MS);
  }
  function stopAutoScan() {
    autoMode = false;
    clearInterval(autoTimer); autoTimer = null;
    autoBtn.textContent = '🔁 開始自動掃描';
    captureBtn.style.display = '';
    setStatus('');
  }
  autoBtn.addEventListener('click', () => { autoMode ? stopAutoScan() : startAutoScan(); });

  $('sendBtn').addEventListener('click', async () => {
    const plate = plateInput.value.trim().toUpperCase();
    if (plate.length < 4) { setStatus('車牌長度不足,請確認'); return; }
    if (!isValidPlate(plate) && !confirm('「' + plate + '」不符合台灣車牌格式(如 ABC-1234、123-ABC、1234-AB),仍要送出嗎?')) return;
    const btn = $('sendBtn');
    btn.disabled = true;
    try {
      const res = await fetch(RELAY, { method: 'POST', body: plate });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus('✅ 已送到電腦:' + plate, true);
      result.style.display = 'none';
      $('cam').style.display = '';
      captureBtn.style.display = '';
      autoBtn.style.display = '';
    } catch (err) {
      setStatus('送出失敗:' + err.message + '(請確認手機有連網)');
    } finally {
      btn.disabled = false;
    }
  });

  $('retryBtn').addEventListener('click', () => {
    stopAutoScan();
    result.style.display = 'none';
    $('cam').style.display = '';
    captureBtn.style.display = '';
    autoBtn.style.display = '';
    setStatus('');
  });


  // ---------- 鎖定 / 解鎖(配對碼已用 PIN 加密,網頁裡看不到明文)----------
  const CFG = {"s":"nXWuoQi1Ta2G7AGPKrh6gw==","iv":"6Tl1uBylqzVBoddF","c":"rPovsF5Jvs/NMxMHEvB5reqXgbXZG/uzAYraEtAWHkbdoYiU6i1Iggae"};
  const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
  async function decryptTopic(pin) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(CFG.s), iterations: 200000, hash: 'SHA-256' }, km,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(CFG.iv) }, key, unb64(CFG.c));
    return new TextDecoder().decode(p);
  }
  const lockEl = $('lock'), appEl = $('app'), lockMsg = $('lockMsg'), pinIn = $('pinIn'), unlockBtn = $('unlockBtn');
  let fails = 0;

  async function doUnlock() {
    lockMsg.textContent = '';
    if (!pinIn.value) return;
    unlockBtn.disabled = true;
    try {
      let topic;
      try { topic = await decryptTopic(pinIn.value); }
      catch (e) {
        fails++;
        const wait = Math.min(30, Math.pow(2, fails - 1));
        lockMsg.textContent = 'PIN 錯誤,請等 ' + wait + ' 秒再試';
        await new Promise((res) => setTimeout(res, wait * 1000));
        lockMsg.textContent = ''; pinIn.value = '';
        return;
      }
      RELAY = 'https://ntfy.sh/' + topic;
      getWorker().catch(() => {});   // 解鎖後立刻在背景預載辨識引擎
      pinIn.value = '';
      lockEl.style.display = 'none';
      appEl.style.display = '';
    } finally { unlockBtn.disabled = false; }
  }
  unlockBtn.addEventListener('click', doUnlock);
  pinIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') doUnlock(); });
  if (!window.crypto || !crypto.subtle) { $('lockTitle').textContent = '⚠️ 需要 HTTPS 才能使用'; unlockBtn.style.display = pinIn.style.display = 'none'; }
  lockEl.style.display = '';

  startBtn.addEventListener('click', startCamera);
})();
</script>
