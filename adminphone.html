<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>車牌掃描</title>
<style>
  :root { --bg:#14171a; --panel:#1e2226; --text:#eef0f2; --sub:#9aa3ab; --accent:#3ddc84; --accent-dim:#2a8f57; --border:#2b3136; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); height:100%; overscroll-behavior:none; }
  body { font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; }
  .wrap { max-width:480px; margin:0 auto; width:100%; }
  h1 { font-size:1.05rem; margin:4px 0 12px; text-align:center; }
  .cam { position:relative; background:#000; border-radius:12px; overflow:hidden;
    height:48vh; max-height:420px; min-height:220px; }
  video { width:100%; height:100%; display:block; object-fit:cover; }
  .thumb { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .thumb.show { display:block; }
  .guide { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border:2px solid var(--accent);
    border-radius:8px; box-shadow:0 0 0 9999px rgba(0,0,0,.5); pointer-events:none; }
  .tip { position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:12px; background:rgba(0,0,0,.6);
    padding:3px 10px; border-radius:6px; color:#cfd6dc; white-space:nowrap; pointer-events:none; }
  button { font:inherit; font-weight:600; border:none; border-radius:10px; padding:14px; width:100%; margin-top:10px; cursor:pointer; }
  .primary { background:var(--accent); color:#06231a; }
  .primary:disabled { background:#37403a; color:#7c877f; }
  .second { background:transparent; color:var(--accent); border:1px solid var(--accent-dim); }
  .status { font-size:13px; color:var(--sub); text-align:center; margin-top:10px; min-height:1.3em; }
  .result { display:none; margin-top:12px; }
  .label { font-size:12px; color:var(--sub); margin-bottom:6px; }
  input { width:100%; font-size:28px; font-weight:700; letter-spacing:.08em; text-align:center; padding:12px;
    border-radius:10px; border:1.5px solid var(--accent-dim); background:#0f1214; color:var(--text); }
  .ok { color:var(--accent); }
  .mode-switch { display:flex; gap:8px; margin-bottom:10px; }
  .mode-btn { flex:1; margin-top:0; padding:10px; background:var(--panel); color:var(--sub);
    border:1.5px solid var(--border); font-weight:600; }
  .mode-btn.active { background:var(--accent); color:#06231a; border-color:var(--accent); }
  .lock-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:20px; }
  .lock-box { width:100%; max-width:320px; text-align:center; }
  .lock-icon { font-size:2.4rem; margin-bottom:8px; }
  .lock-title { font-size:1rem; color:var(--text); margin-bottom:18px; font-weight:600; }
  #pinInput { width:100%; font-size:1.6rem; letter-spacing:.3em; text-align:center; padding:14px 44px 14px 14px;
    border-radius:10px; border:1.5px solid var(--accent-dim); background:#0f1214; color:var(--text); }
  #pinInput:focus { outline:none; border-color:var(--accent); }
  .pin-wrap { position:relative; margin-bottom:12px; }
  .pin-eye { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:auto; margin:0;
    padding:6px 8px; background:transparent; border:none; font-size:1.15rem; line-height:1; cursor:pointer; opacity:.75; }
  .pin-eye:active { opacity:1; }
  .lock-error { color:#e2574c; font-size:.82rem; margin-top:10px; min-height:1.2em; }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
</style>
</head>
<body>
<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">請輸入密碼</div>
    <div class="pin-wrap">
      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" placeholder="••••••••">
      <button id="pinToggle" type="button" class="pin-eye" aria-label="顯示密碼">👁</button>
    </div>
    <button id="pinConfirm" class="primary">確認</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div class="wrap" id="mainApp" style="display:none">
  <h1>🔍 車牌掃描(送到電腦)</h1>
  <div class="mode-switch">
    <button id="modeNear" class="mode-btn">📏 長車牌</button>
    <button id="modeFar" class="mode-btn active">📐 短車牌</button>
  </div>
  <div class="cam">
    <video id="video" playsinline muted autoplay></video>
    <img class="thumb" id="thumb" alt="">
    <div class="guide" id="guide"></div>
    <div class="tip">把車牌放進綠框內、拍清楚不反光</div>
  </div>
  <button id="startBtn" class="primary">📸 開啟相機</button>
  <button id="captureBtn" class="primary" style="display:none">📷 拍照辨識</button>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="label">辨識結果(不對請直接修改)</div>
    <input id="plate" type="text" spellcheck="false" autocapitalize="characters" autocomplete="off">
    <button id="sendBtn" class="primary">✅ 確認並送到電腦</button>
    <button id="retryBtn" class="second">重新拍攝</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  // ====== PIN碼鎖定 ======
  // 儲存的是 PIN 的 SHA-256 雜湊值,原始碼中不直接出現明碼PIN
  const CORRECT_PIN_HASH = '14123deec10fe392ebbf62ca45e5fc752a9c950f1f1fcc013530de84004c4af3';

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  const lockScreen = document.getElementById('lockScreen');
  const mainApp = document.getElementById('mainApp');
  const pinInput = document.getElementById('pinInput');
  const pinConfirm = document.getElementById('pinConfirm');
  const lockError = document.getElementById('lockError');
  const lockBox = document.querySelector('.lock-box');
  const pinToggle = document.getElementById('pinToggle');

  pinToggle.addEventListener('click', () => {
    const showing = pinInput.type === 'text';
    pinInput.type = showing ? 'password' : 'text';
    pinToggle.textContent = showing ? '👁' : '🙈';
    pinToggle.setAttribute('aria-label', showing ? '顯示密碼' : '隱藏密碼');
    pinInput.focus();
  });

  function unlock() {
    lockScreen.style.display = 'none';
    mainApp.style.display = '';
    try { sessionStorage.setItem('plateAuthOK', '1'); } catch (e) {}
  }

  async function tryUnlock() {
    pinConfirm.disabled = true;
    const hash = await sha256Hex(pinInput.value);
    pinConfirm.disabled = false;
    if (hash === CORRECT_PIN_HASH) {
      unlock();
    } else {
      lockError.textContent = '密碼錯誤,請再試一次';
      lockBox.classList.remove('shake');
      void lockBox.offsetWidth;
      lockBox.classList.add('shake');
      pinInput.value = '';
      pinInput.focus();
    }
  }

  pinConfirm.addEventListener('click', tryUnlock);
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

  let alreadyAuthed = false;
  try { alreadyAuthed = sessionStorage.getItem('plateAuthOK') === '1'; } catch (e) {}
  if (alreadyAuthed) unlock(); else setTimeout(() => pinInput.focus(), 300);
  // ======================
  // ====== 設定 ======
  const TOPIC = 'plate-8ecce93270be6f243cbe';                 // 與電腦端腳本必須相同(等同配對密碼,請勿外流)
  const RELAY = 'https://ntfy.sh/' + TOPIC;
  const KEEP_HYPHEN = false;
  const MODES = {
    near: { camWidth: 3840, camHeight: 2160, guideWidthRatio: 0.92, guideAspect: 2.2, ocrTargetWidth: 1300, label: '長車牌' },
    far:  { camWidth: 3840, camHeight: 2160, guideWidthRatio: 0.75, guideAspect: 1.3, ocrTargetWidth: 1100, label: '短車牌' }
  };
  let currentMode = 'far';
  // ==================

  const $ = (id) => document.getElementById(id);
  const video = $('video'), guide = $('guide'), statusEl = $('status');
  const startBtn = $('startBtn'), captureBtn = $('captureBtn');
  const modeNearBtn = $('modeNear'), modeFarBtn = $('modeFar');
  const result = $('result'), thumb = $('thumb'), plateInput = $('plate');
  let stream = null, workerPromise = null, cropRect = null;

  const setStatus = (t, ok) => { statusEl.textContent = t; statusEl.classList.toggle('ok', !!ok); };

  function updateModeButtons() {
    modeNearBtn.classList.toggle('active', currentMode === 'near');
    modeFarBtn.classList.toggle('active', currentMode === 'far');
  }

  async function switchMode(key) {
    if (key === currentMode) return;
    currentMode = key;
    updateModeButtons();
    layoutGuide();
    if (!stream) return;
    const m = MODES[currentMode];
    const track = stream.getVideoTracks()[0];
    try {
      if (track && track.applyConstraints) {
        await track.applyConstraints({ width: { ideal: m.camWidth }, height: { ideal: m.camHeight } });
        layoutGuide();
        return;
      }
    } catch (e) { /* 部分手機不支援即時換解析度,改用下面的重啟相機 */ }
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
    startBtn.style.display = '';
    captureBtn.style.display = 'none';
    startCamera();
  }

  modeNearBtn.addEventListener('click', () => switchMode('near'));
  modeFarBtn.addEventListener('click', () => switchMode('far'));

  function getWorker() {
    if (!workerPromise) {
      workerPromise = (async () => {
        const w = await Tesseract.createWorker({
          logger: (m) => { if (m.status === 'recognizing text') setStatus('辨識中… ' + Math.round(m.progress * 100) + '%'); }
        });
        await w.loadLanguage('eng');
        await w.initialize('eng');
        await w.setParameters({
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
          tessedit_pageseg_mode: '7'
        });
        return w;
      })();
      workerPromise.catch(() => { workerPromise = null; });
    }
    return workerPromise;
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('此瀏覽器不支援相機(網址必須是 HTTPS)'); return;
    }
    startBtn.disabled = true;
    try {
      const m = MODES[currentMode];
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: m.camWidth }, height: { ideal: m.camHeight } }, audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      startBtn.style.display = 'none';
      captureBtn.style.display = '';
      setStatus('');
      getWorker().catch((e) => setStatus('OCR引擎載入失敗:' + e.message));
    } catch (err) {
      startBtn.disabled = false;
      setStatus('無法開啟相機:' + err.name + '(請允許相機權限)');
    }
  }

  const camEl = document.querySelector('.cam');

  function visibleSourceRect() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const cw = camEl.clientWidth, ch = camEl.clientHeight;
    if (!vw || !vh || !cw || !ch) return null;
    // object-fit:cover 會用較大的縮放比例填滿容器,超出部分被裁掉
    const scale = Math.max(cw / vw, ch / vh);
    const visW = cw / scale, visH = ch / scale;
    return { x: (vw - visW) / 2, y: (vh - visH) / 2, w: visW, h: visH };
  }

  function layoutGuide() {
    const vis = visibleSourceRect();
    if (!vis) return;
    const m = MODES[currentMode];
    const gw = vis.w * m.guideWidthRatio;
    const gh = Math.min(gw / m.guideAspect, vis.h * 0.9);
    guide.style.width = (gw / vis.w * 100) + '%';
    guide.style.height = (gh / vis.h * 100) + '%';
  }

  // 拍照當下直接讀取綠框跟影片在螢幕上的「實際」渲染位置來換算裁切區域,
  // 不依賴之前算好、可能因版面變動(如網址列收合、捲動)而過期的數字,
  // 確保「畫面上看到框住什麼,就精準裁什麼」。
  function currentCropRectFromScreen() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const videoRect = video.getBoundingClientRect();
    const guideRect = guide.getBoundingClientRect();
    if (!videoRect.width || !videoRect.height) return null;
    const scale = Math.max(videoRect.width / vw, videoRect.height / vh);
    const visW = videoRect.width / scale, visH = videoRect.height / scale;
    const originX = (vw - visW) / 2, originY = (vh - visH) / 2;
    const gx = (guideRect.left - videoRect.left) / scale;
    const gy = (guideRect.top - videoRect.top) / scale;
    return {
      x: originX + gx,
      y: originY + gy,
      w: guideRect.width / scale,
      h: guideRect.height / scale
    };
  }
  video.addEventListener('loadedmetadata', layoutGuide);
  video.addEventListener('resize', layoutGuide);
  window.addEventListener('resize', () => { if (stream) layoutGuide(); });
  window.addEventListener('orientationchange', () => setTimeout(layoutGuide, 200));

  function preprocess() {
    const rect = currentCropRectFromScreen();
    if (!rect) return null;
    const scale = MODES[currentMode].ocrTargetWidth / rect.w;
    const c = document.createElement('canvas');
    c.width = Math.round(rect.w * scale);
    c.height = Math.round(rect.h * scale);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
    let min = 255, max = 0;
    for (let i = 0; i < d.length; i += 4) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      d[i] = d[i + 1] = d[i + 2] = g;
      if (g < min) min = g; if (g > max) max = g;
    }
    const range = Math.max(max - min, 1);
    for (let i = 0; i < d.length; i += 4) d[i] = d[i + 1] = d[i + 2] = ((d[i] - min) / range) * 255;
    ctx.putImageData(img, 0, 0);
    return c;
  }

  const clean = (raw) => {
    let t = (raw || '').toUpperCase().replace(/[^A-Z0-9\-]/g, '');
    return KEEP_HYPHEN ? t : t.replace(/-/g, '');
  };
  const looksLikePlate = (t) => { const n = t.replace(/-/g, '').length; return n >= 5 && n <= 7; };

  captureBtn.addEventListener('click', async () => {
    if (!stream || !video.videoWidth) { setStatus('相機尚未就緒'); return; }
    captureBtn.disabled = true;
    captureBtn.textContent = '辨識中…';
    result.style.display = 'none';
    setStatus('載入辨識引擎…(第一次會比較久)');
    try {
      const canvas = preprocess();
      if (!canvas) { setStatus('相機畫面尚未就緒,請稍等再試'); captureBtn.disabled = false; captureBtn.textContent = '📷 拍照辨識'; return; }
      const worker = await getWorker();
      let { data } = await worker.recognize(canvas);
      let text = clean(data.text);
      if (!looksLikePlate(text)) {
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const r2 = await worker.recognize(canvas);
        const t2 = clean(r2.data.text);
        await worker.setParameters({ tessedit_pageseg_mode: '7' });
        if (looksLikePlate(t2) || t2.length > text.length) text = t2;
      }
      thumb.src = canvas.toDataURL('image/jpeg', 0.8);
      thumb.classList.add('show');
      guide.style.display = 'none';
      document.querySelector('.tip').style.display = 'none';
      plateInput.value = text;
      result.style.display = 'block';
      captureBtn.style.display = 'none';
      setStatus(text ? (looksLikePlate(text) ? '請核對車牌後按確認'
                       : '⚠️ 結果不像車牌,可能是太靠近讓車牌超出框外(被切掉一角),請往後退一點,讓整個車牌完整落在綠框內再重拍')
                     : '沒有辨識到文字,請重拍或手動輸入');
    } catch (err) {
      setStatus('辨識失敗:' + err.message);
    } finally {
      captureBtn.disabled = false;
      captureBtn.textContent = '📷 拍照辨識';
    }
  });

  $('sendBtn').addEventListener('click', async () => {
    const plate = plateInput.value.trim().toUpperCase();
    if (plate.length < 4) { setStatus('車牌長度不足,請確認'); return; }
    const btn = $('sendBtn');
    btn.disabled = true;
    try {
      const res = await fetch(RELAY, { method: 'POST', body: plate });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus('✅ 已送到電腦:' + plate, true);
      result.style.display = 'none';
      thumb.classList.remove('show');
      guide.style.display = '';
      document.querySelector('.tip').style.display = '';
      captureBtn.style.display = '';
    } catch (err) {
      setStatus('送出失敗:' + err.message + '(請確認手機有連網)');
    } finally {
      btn.disabled = false;
    }
  });

  $('retryBtn').addEventListener('click', () => {
    result.style.display = 'none';
    thumb.classList.remove('show');
    guide.style.display = '';
    document.querySelector('.tip').style.display = '';
    captureBtn.style.display = '';
    setStatus('');
  });

  startBtn.addEventListener('click', startCamera);
})();
</script>
</body>
</html>
